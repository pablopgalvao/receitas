<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Página não encontrada | Lar do Chef</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="A página que você procura não foi encontrada.">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f7;
    }
    .not-found-wrapper {
      text-align: center;
      padding: 2rem;
    }
    .not-found-favicon {
      width: 96px;
      height: 96px;
      margin-bottom: 1.5rem;
    }
    .not-found-title {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    .not-found-subtitle {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 2rem;
    }
    .not-found-button {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #ff7c2a;
      color: #fff;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .not-found-button:hover {
      background: #e86d21;
    }
  </style>
</head>
<body>
  <div class="not-found-wrapper">
    <img src="/favicon.ico" alt="Lar do Chef" class="not-found-favicon">
    <h1 class="not-found-title">404</h1>
    <p class="not-found-subtitle">Ops! A página que você tentou acessar não existe.</p>
    <a href="/" class="not-found-button">Voltar para a página inicial</a>
  </div>
</body>
</html>
